version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: ms2-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ms2
      MYSQL_USER: alejandro
      MYSQL_PASSWORD: aqp1234
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  ms2:
    build: .
    container_name: ms2-app
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ms2
      DB_USER: alejandro
      DB_PASS: aqp1234
    depends_on:
      - mysql

volumes:
  mysql_data:
